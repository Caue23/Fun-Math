<section class="container modulo" *ngIf="tema">
  <button class="btn voltar" (click)="voltarHome()">⬅️ Voltar</button>

  <h1 class="modulo__titulo" [style.color]="tema.cor">
    {{ tema.emoji }} {{ tema.titulo }}
  </h1>
  <p class="modulo__descricao">{{ tema.descricao }}</p>

  <!-- Vídeo responsivo (iframe com URL sanitizada pelo DomSanitizer) -->
  <div class="video-box">
    <iframe
      [src]="videoUrl"
      title="Aula de {{ tema.titulo }}"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>

  <!-- Explicação passo a passo (infográfico em cards) -->
  <section class="passos">
    <h2 class="passos__titulo">
      <span>🧠</span> Como resolver, passo a passo
    </h2>

    <div class="passos__trilha">
      <div
        class="passo-card"
        *ngFor="let passo of tema.passos; let i = index"
        [style.border-top-color]="tema.cor"
      >
        <div class="passo-card__numero" [style.background]="tema.cor">
          {{ i + 1 }}
        </div>
        <div class="passo-card__icone">{{ passo.icone }}</div>
        <h3 class="passo-card__titulo">{{ passo.titulo }}</h3>
        <p class="passo-card__texto">{{ passo.texto }}</p>
        <div
          class="passo-card__exemplo"
          *ngIf="passo.exemplo"
          [style.color]="tema.cor"
        >{{ passo.exemplo }}</div>
      </div>
    </div>

    <!-- Botão que confirma a leitura e libera o quiz -->
    <button
      *ngIf="!explicacaoLida"
      class="btn btn-entendi"
      [style.background]="tema.cor"
      (click)="marcarComoLido()"
    >
      Já entendi! Pode liberar o Quiz 👍
    </button>
  </section>

  <!-- Botões de ação (liberados após ler a explicação) -->
  <div class="modulo__acoes" *ngIf="explicacaoLida">
    <!-- Botão grande e chamativo para o quiz -->
    <button
      class="btn btn-quiz"
      [style.background]="tema.cor"
      (click)="irParaQuiz()"
    >
      Ir para o Quiz! 🚀
    </button>

    <!-- Extra só para a tabuada: tabela completa para preencher -->
    <button
      *ngIf="tema.slug === 'tabuada'"
      class="btn btn-tabuada-completa"
      (click)="irParaTabuadaCompleta()"
    >
      Completar a Tabuada 1 a 10 ✏️
    </button>
  </div>
</section>
